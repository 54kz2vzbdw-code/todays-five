<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today's Five — card</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* the card a texted link shows: the Today screen in Dark, with the title. 1200×630, rendered once by tools/og.mjs */
  html,body{width:1200px;height:630px;overflow:hidden;background:#1A1D21}
  body{font-family:"Lato","Helvetica Neue",Helvetica,Arial,sans-serif;color:#F5F1EA;position:relative}
  #glow{position:absolute;inset:0;background:radial-gradient(125% 78% at 50% 34%, rgba(210,97,40,.16), rgba(210,97,40,0) 62%);opacity:1}
  .card{position:absolute;inset:0;padding:54px 72px 0 72px;display:flex;flex-direction:column}
  .rail{display:flex;align-items:center;justify-content:space-between;font-family:"PT Sans","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:17px;letter-spacing:.15em;text-transform:uppercase;color:#7F858C;padding-bottom:18px;border-bottom:1px solid rgba(245,241,234,.10)}
  .rail .r{display:flex;align-items:center;gap:22px}
  .rail .count{color:#9AA0A8;letter-spacing:.09em}
  .rail .count b{color:#E8814A}
  .rail .seg{display:inline-flex;border:1px solid rgba(245,241,234,.10);border-radius:999px;overflow:hidden}
  .rail .seg span{padding:9px 16px}
  .rail .seg span.on{color:#E8814A;background:#23272C}
  .rail .dot{width:9px;height:9px;border-radius:50%;background:#D26128;display:inline-block}
  .lines{margin-top:46px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:flex-start;gap:24px;font-size:72px;font-weight:900;letter-spacing:-.025em;line-height:1.1;position:relative}
  .box{flex:0 0 auto;width:46px;height:46px;margin-top:18px;border:4px solid #65696E;border-radius:8px;display:grid;place-items:center}
  .row.done{color:#7F858C}
  .row.done .box{border-color:#D26128;background:#D26128}
  .row.done .box svg{width:32px;height:32px}
  .row.done .box path{fill:none;stroke:#1A1D21;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .row.done .tx{position:relative}
  .row.done .tx::after{content:"";position:absolute;left:-2px;right:-2px;top:56%;height:6px;border-radius:999px;background:#D26128;box-shadow:0 0 12px rgba(210,97,40,.5)}
  .title{position:absolute;left:72px;right:72px;bottom:44px;display:flex;align-items:baseline;justify-content:space-between;gap:24px}
  .title h1{font-size:44px;font-weight:900;letter-spacing:-.02em;color:#F5F1EA}
  .title p{font-family:"PT Sans","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:22px;color:#9AA0A8;text-align:right}
</style>
</head>
<body>
<div id="glow"></div>
<div class="card">
  <div class="rail"><span>Monday · September 8</span><span class="r"><span class="count"><b>1</b>/4</span><span class="dot"></span><span class="seg"><span class="on">Today</span><span>Everything</span></span></span></div>
  <div class="lines">
    <div class="row done"><span class="box"><svg viewBox="0 0 24 24"><path d="M4.5 12.6l5 5.2L19.5 6.4"/></svg></span><span class="tx">Call the bank before noon</span></div>
    <div class="row"><span class="box"></span><span class="tx">Walk after lunch</span></div>
    <div class="row"><span class="box"></span><span class="tx">Send the draft to Sam</span></div>
    <div class="row"><span class="box"></span><span class="tx">Read for twenty minutes</span></div>
  </div>
  <div class="title"><h1>Today's Five</h1><p>A short list you keep open on screen all day.<br>Free, no account.</p></div>
</div>
</body>
</html>
