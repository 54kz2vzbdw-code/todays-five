<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today's Five — card</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* the card a texted link shows: the Today screen in Dark, with the title. 1200×630, rendered once by tools/og.mjs */
  html,body{width:1200px;height:630px;overflow:hidden;background:#1A1D21}
  body{font-family:"Lato","Helvetica Neue",Helvetica,Arial,sans-serif;color:#F5F1EA;position:relative}
  #glow{position:absolute;inset:0;background:radial-gradient(125% 78% at 50% 34%, rgba(210,97,40,.16), rgba(210,97,40,0) 62%);opacity:1}
  .og-card{position:absolute;inset:0;padding:50px 72px 0 72px;display:flex;flex-direction:column}
  .og-rail{display:flex;align-items:center;justify-content:space-between;font-family:"PT Sans","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:17px;letter-spacing:.15em;text-transform:uppercase;color:#7F858C;padding-bottom:18px;border-bottom:1px solid rgba(245,241,234,.10)}
  .og-rail .og-r{display:flex;align-items:center;gap:22px}
  .og-rail .og-count{color:#9AA0A8;letter-spacing:.09em}
  .og-rail .og-count b{color:#E8814A}
  .og-rail .og-seg{display:inline-flex;border:1px solid rgba(245,241,234,.10);border-radius:999px;overflow:hidden}
  .og-rail .og-seg span{padding:9px 16px}
  .og-rail .og-seg span.og-on{color:#E8814A;background:#23272C}
  .og-rail .og-dot{width:9px;height:9px;border-radius:50%;background:#D26128;display:inline-block}
  .og-lines{margin-top:70px;display:flex;flex-direction:column;gap:14px}
  .og-row{display:flex;align-items:flex-start;gap:24px;font-size:74px;font-weight:900;letter-spacing:-.025em;line-height:1.1;position:relative}
  .og-box{flex:0 0 auto;width:48px;height:48px;margin-top:20px;border:4px solid #65696E;border-radius:8px;display:grid;place-items:center}
  .og-row.done{color:#7F858C}
  .og-row.done .og-box{border-color:#D26128;background:#D26128}
  .og-row.done .box svg{width:32px;height:32px}
  .og-row.done .box path{fill:none;stroke:#1A1D21;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .og-row.done .og-tx{position:relative}
  .og-row.done .og-tx::after{content:"";position:absolute;left:-2px;right:-2px;top:56%;height:6px;border-radius:999px;background:#D26128;box-shadow:0 0 12px rgba(210,97,40,.5)}
  /* the title band has its own room under the list: nothing overlaps a line */
  .og-title{margin-top:auto;padding:30px 0 50px;border-top:1px solid rgba(245,241,234,.12);display:flex;align-items:baseline;justify-content:space-between;gap:32px}
  .og-title h1{font-size:46px;font-weight:900;letter-spacing:-.02em;color:#F5F1EA;white-space:nowrap}
  .og-title p{font-family:"PT Sans","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:24px;color:#9AA0A8;text-align:right;white-space:nowrap}
</style>
</head>
<body>
<div id="glow"></div>
<div class="og-card">
  <div class="og-rail"><span>Monday · September 8</span><span class="og-r"><span class="og-count"><b>1</b>/3</span><span class="og-dot"></span><span class="og-seg"><span class="og-on">Today</span><span>Everything</span></span></span></div>
  <div class="og-lines">
    <div class="og-row done"><span class="og-box"><svg viewBox="0 0 24 24"><path d="M4.5 12.6l5 5.2L19.5 6.4"/></svg></span><span class="og-tx">Call the bank before noon</span></div>
    <div class="og-row"><span class="og-box"></span><span class="og-tx">Walk after lunch</span></div>
    <div class="og-row"><span class="og-box"></span><span class="og-tx">Send the draft to Sam</span></div>
  </div>
  <div class="og-title"><h1>Today's Five</h1><p>A short list you keep open on screen all day. Free, no account.</p></div>
</div>
</body>
</html>
